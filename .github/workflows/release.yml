name: Release Plugin

on:
  push:
    tags:
      - "v*" # 仅当推送 v 开头的 tag 时触发，如 v1.0.9

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许创建 Release

    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置 Java 环境
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. 解析 Tag 版本号
      # 将 refs/tags/v1.0.9 解析为 1.0.9 并存入环境变量
      - name: Extract Version
        id: extract_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected version: $VERSION"

      # 4. 设置 Gradle (包含缓存机制，解决 900MB SDK 下载慢的问题)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # 5. 构建插件
      # 使用 -PpluginVersion 将步骤3提取的版本号传给 Gradle
      - name: Build Plugin
        run: ./gradlew buildPlugin -PpluginVersion=${{ env.VERSION }}

      # 6. 创建 GitHub Release 并上传附件
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # Release 的标题
          name: Release ${{ env.VERSION }}
          # 自动生成 Release Note (基于 commit 记录)
          generate_release_notes: true
          # 上传 build/distributions/ 下的所有 zip 文件
          files: build/distributions/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}